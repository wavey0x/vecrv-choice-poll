[project]
name = "vecrv-polls"
version = "0.1.0"
description = "Immutable multi-choice veCRV preference polls"
requires-python = ">=3.10,<3.14"
dependencies = [
    "titanoboa==0.2.8",
    "vyper==0.4.3",
]

[dependency-groups]
dev = [
    "hypothesis==6.138.2",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "fork: requires an Ethereum mainnet RPC URL",
]
